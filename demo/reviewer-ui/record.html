<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lighthouse reviewer recorder</title>
<style>html,body{margin:0;height:100%;background:#0f1115;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}#s{position:fixed;left:8px;bottom:8px;font:12px system-ui;color:#0f1115}</style>
</head>
<body>
<iframe id="demo" src="/"></iframe>
<div id="s"></div>
<script>
// Captures this tab (auto-selected by title via a Chrome flag), plays the embedded demo,
// records video-only WebM, and uploads it to the demo server.
const status = (t) => { document.getElementById('s').textContent = t; document.title = `Lighthouse reviewer recorder — ${t}`; };
const frame = document.getElementById('demo');
frame.addEventListener('load', async () => {
  const player = frame.contentWindow.__player;
  await new Promise((r) => setTimeout(r, 4000)); // let the framed harness UI load
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30, width: 1280, height: 800 }, audio: false, preferCurrentTab: true });
  } catch (e) { status('capture refused: ' + e.message); return; }
  // H.264 MP4 plays natively on Windows/macOS players; VP9 WebM does not.
  const mime = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1.42E01E') ? 'video/mp4;codecs=avc1.42E01E' : 'video/webm;codecs=vp9';
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 4_000_000 });
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    status('uploading');
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    await fetch('/upload?ext=' + (mime.startsWith('video/mp4') ? 'mp4' : 'webm'), { method: 'POST', body: blob });
    status('done');
  };
  rec.start(1000);
  status('recording');
  player.show(0);
  player.setPaused(false);
  const poll = setInterval(() => {
    if (player.index === player.count - 1 && player.paused) {
      clearInterval(poll);
      setTimeout(() => { rec.stop(); stream.getTracks().forEach((t) => t.stop()); }, 1500);
    }
  }, 500);
});
</script>
</body>
</html>
